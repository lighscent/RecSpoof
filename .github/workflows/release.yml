name: Auto Release

on:
  push:
    branches: [cpp-rewrite]
    paths: [src/**, include/**, CMakeLists.txt, .github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from src/main.cpp
        id: version
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/main.cpp -Pattern 'kVersion = L"([^"]+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Compare with latest tag
        id: check
        shell: pwsh
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          $latest = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
          "latest=$latest" >> $env:GITHUB_OUTPUT
          if (-not $latest) {
            "changed=true" >> $env:GITHUB_OUTPUT
            "range=" >> $env:GITHUB_OUTPUT
          } elseif ($latest -eq "v$env:VER") {
            "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
            "range=$latest..HEAD" >> $env:GITHUB_OUTPUT
          }

      - name: Collect commit messages since last release
        id: notes
        if: steps.check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $range = "${{ steps.check.outputs.range }}"
          if ($range) {
            git log --reverse --pretty=format:'- %s' $range | Out-File -Encoding utf8 notes.txt
          } else {
            git log --reverse --pretty=format:'- %s' | Out-File -Encoding utf8 notes.txt
          }
          if (-not (Get-Item notes.txt).Length) { "- Initial release" | Out-File -Encoding utf8 notes.txt }

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release

      - name: Create tag and release
        if: steps.check.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$env:VER" -m "RecSpoof v$env:VER"
          git push origin "v$env:VER"
          Compress-Archive -Path build/Release/RecSpoof.exe -DestinationPath "recspoof-$env:VER.zip"
          gh release create "v$env:VER" --title "RecSpoof $env:VER" --notes-file notes.txt "recspoof-$env:VER.zip"
